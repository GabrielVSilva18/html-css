<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        @font-face {
            font-family: 'OldLondon';
            src: url(font/OldLondon.ttf) format(truetype);
            src: url(font/Olondona.otf) format(opentype);
        }
        div {
            font-family: OldLondon, serif;
            width: 160px;
        }
        div > p {
            display: none;
        }
        div:hover {
            color: rgb(7, 222, 230);
            font-style: italic;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: darkmagenta;
            width: 160px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse no texto a seguir:</p>
    <div>
        Passe o mouse aqui &#x1F60F
        <p>Easter egg secreto hihihiha</p>
    </div> <br>
    <a href="pseudoclasses.html">Voltar</a>
</body>
</html>
