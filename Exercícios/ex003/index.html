<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IMAGEM</title>
    </head>
    <body>
        <h1>Teste com IMAGENS</h1>
        <!--Imagem na mesma pasta-->
        <p>A seguir uma imagem desta mesma pasta:</p>
        <img src="logohtml.png" alt="Logotipo do HTML5">
        <!--Imagem em outra pasta-->
        <p>A seguir uma imagem dentro de uma sub-pasta:</p>
        <img src="imagens/logocss.png" alt="Logotipo do CSS3">
        <!--Imagem externa-->
        <p>E por fim uma imagem externa:</p>
        <img src="https://freesvg.org/img/1486641506.png" alt="Logotipo do JavaScript">
    </body>
</html>
