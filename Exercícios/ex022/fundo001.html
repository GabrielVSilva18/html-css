<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 01 - Imagem de fundo</title>
    <style>
        body {
            background-image: url(imagens/wallpaper001.jpg);
        }

        div.quadrado {
            border: 5px solid black;
            border-radius: 10px;
            width: 300px;
            height: 300px;
            margin: 5px;
            display: inline-block;
            background-color: lightgray;
        }

        #quadrado1 {
            background-color: rgb(31, 31, 83);
        }

        #quadrado2 {
            background-image: linear-gradient(to top, rgb(127, 15, 161), rgb(78, 224, 250));
        }

        #quadrado3 {
            background-image: url('imagens/pattern003.png');
        }
    </style>
</head>
<body>
    <div class="quadrado" id="quadrado1">

    </div>
    <div class="quadrado" id="quadrado2">

    </div>
    <div class="quadrado" id="quadrado3">

    </div>
</body>
</html>
