<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            background-color: lightblue;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkblue;
            padding: 10px;
            outline: 10px solid peru;
            margin: 10px auto;
            
        }
        a {
            color: rgb(0, 0, 0);
            background-color: yellow;
            border-width: 5px;
            border-color: yellow;
            border-style: outset;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-top: 10px;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixa box-level</h1>
    <p>Parágrafos também são exemplos de caixas box levels, mas os <a href="#">links são exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona</p>
</body>
</html>
