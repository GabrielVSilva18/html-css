<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando Gradiente</title>
    <style>
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom , #F25C78, #D94188, #7C39BF, #F2C641, #F27F3D 50%);
            background-attachment: fixed;
        }
        h1 {
            color: white;
        }
        p {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Testando gradiente em CSS</h1>
</body>
</html>
