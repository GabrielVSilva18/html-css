<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icone.ico" type="image/x-icon">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Algumas tags em HTML</h1>
    <ul type="square">
        <li><abbr title="Tag <title>">Título da página</abbr></li>
        <li><abbr title="Tag entre <h1> até <h6>">Títulos de texto</abbr></li>
        <li><abbr title="Tag <p>">Parágrafos</abbr></li>
        <li><abbr title="Tag <img>">Imagens</abbr></li>
        <li><abbr title="Tag <b> (não semântica) ou tag <strong> (semântica)">Negrito</abbr></li>
        <li><abbr title="Tag <i> (não semântica) ou tag <em> (semântica)">Itálico</abbr></li>
        <li><abbr title="Tag <ol> para listas ordenadas e tag <ul> para não ordenadas">Listas</abbr></li>
        <li><abbr title="Tag <br>">Quebra de linha</abbr></li>
    </ul>
</body>
</html>
